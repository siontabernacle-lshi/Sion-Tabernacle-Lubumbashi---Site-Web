name: Import vidéos YouTube
on:
  schedule: [{cron: '0 * * * *'}]   # toutes les heures
  workflow_dispatch:
permissions: {contents: write}
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire le flux de la chaîne
        run: |
          curl -sL "https://www.youtube.com/feeds/videos.xml?channel_id=UCtg-M0z2ueO4elhzKdb8pRw" -o feed.xml
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          ns={'a':'http://www.w3.org/2005/Atom','yt':'http://www.youtube.com/xml/schemas/2015'}
          r=ET.parse('feed.xml').getroot()
          out=[{'yt':e.find('yt:videoId',ns).text,'t':e.find('a:title',ns).text,'d':e.find('a:published',ns).text[:10],'desc':''} for e in r.findall('a:entry',ns)]
          if out: json.dump(out,open('videos.json','w',encoding='utf-8'),ensure_ascii=False,indent=1)
          PY
          rm feed.xml
      - name: Enregistrer
        run: |
          git config user.name "sion-bot"; git config user.email "bot@users.noreply.github.com"
          git add videos.json; git diff --cached --quiet || (git commit -m "Vidéos YouTube mises à jour" && git push)
